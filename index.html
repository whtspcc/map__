<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Маршрут прогулки</title>
<script src="https://api-maps.yandex.ru/2.1/?apikey=4223d0db-cc79-44d2-aaf1-7731bf37c6d5&lang=ru_RU"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
    background: #fff; padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    border-radius: 16px 16px 0 0; box-shadow: 0 -2px 12px rgba(0,0,0,.2);
  }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  button {
    flex: 1; padding: 12px; font-size: 16px; border: 0; border-radius: 10px;
    background: #2b7de9; color: #fff;
  }
  button:disabled { opacity: .5; }
  button.secondary { background: #e8eaed; color: #222; }
  button.active { background: #1a9c4b; color: #fff; }
  input { width: 80px; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 10px; }
  label { align-self: center; flex: 1; font-size: 15px; }
  #status { font-size: 14px; color: #444; min-height: 18px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <div class="row">
    <button id="locate">Где я</button>
    <button id="modePoint" class="secondary active">До точки</button>
    <button id="modeLoop" class="secondary">Круг</button>
  </div>
  <div class="row" id="loopRow" style="display:none">
    <label>Длина, км:</label>
    <input id="km" type="number" min="1" max="20" step="0.5" value="3">
    <button id="build">Построить</button>
  </div>
  <div id="status">Нажми «Где я», чтобы определить положение.</div>
</div>

<script>
let map, me = null, meMark = null, route = null, mode = 'point';
const $ = id => document.getElementById(id);
const status = t => $('status').textContent = t;

const M_LAT = 110540, M_LON = 111320; // метров в градусе

ymaps.ready(() => {
  map = new ymaps.Map('map', { center: [59.93, 30.31], zoom: 12, controls: ['zoomControl'] });

  // режим "до точки": тап по карте
  map.events.add('click', e => {
    if (mode !== 'point') return;
    if (!me) { status('Сначала определи своё положение.'); return; }
    buildRoute([me, e.get('coords')]);
  });
});

function locate() {
  if (!navigator.geolocation) { status('Геолокация не поддерживается.'); return; }
  status('Определяю положение...');
  navigator.geolocation.getCurrentPosition(
    pos => {
      me = [pos.coords.latitude, pos.coords.longitude];
      if (meMark) map.geoObjects.remove(meMark);
      meMark = new ymaps.Placemark(me, {}, { preset: 'islands#blueCircleDotIcon' });
      map.geoObjects.add(meMark);
      map.setCenter(me, 15);
      status(mode === 'point' ? 'Тапни по карте, куда идти.' : 'Задай длину и нажми «Построить».');
    },
    err => status('Ошибка геолокации: ' + err.message),
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

// ---------- запрос маршрута ----------

// пешеходный маршрут через список точек; возвращает {line, km, min}
async function fetchRoute(points, timeoutMs = 8000) {
  const coords = points.map(p => p[1] + ',' + p[0]).join(';');
  const url = 'https://routing.openstreetmap.de/routed-foot/route/v1/foot/' +
              coords + '?overview=full&geometries=geojson';
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const resp = await fetch(url, { signal: ctrl.signal });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (data.code !== 'Ok' || !data.routes.length) throw new Error(data.code || 'нет маршрута');
    const r = data.routes[0];
    return {
      line: r.geometry.coordinates.map(c => [c[1], c[0]]),
      km: r.distance / 1000,
      min: r.duration / 60
    };
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('таймаут, роутер не отвечает');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

function drawRoute(r) {
  if (route) map.geoObjects.remove(route);
  route = new ymaps.Polyline(r.line, {}, {
    strokeColor: '#2b7de9', strokeWidth: 5, strokeOpacity: 0.85
  });
  map.geoObjects.add(route);
  map.setBounds(route.geometry.getBounds(), { checkZoomRange: true, zoomMargin: 40 });
}

// режим "до точки"
async function buildRoute(points) {
  status('Строю маршрут...');
  try {
    const r = await fetchRoute(points);
    drawRoute(r);
    status(`Длина: ${r.km.toFixed(1)} км, время пешком: ~${Math.round(r.min)} мин`);
  } catch (err) {
    status('Не удалось построить маршрут: ' + err.message);
    console.log('route error:', err);
  }
}

// ---------- геометрия ----------

function dist(a, b, cosLat) {
  return Math.hypot((a[0] - b[0]) * M_LAT, (a[1] - b[1]) * M_LON * cosLat);
}

// линия -> точки через каждые ~step метров (отрезок делится на равные части,
// поэтому "туда" и "обратно" по одной улице дают совпадающие точки)
function resample(line, step = 10) {
  const cosLat = Math.cos(line[0][0] * Math.PI / 180);
  const pts = [line[0]];
  for (let i = 1; i < line.length; i++) {
    const a = line[i - 1], b = line[i];
    const d = dist(a, b, cosLat);
    if (d < 0.5) continue;
    const n = Math.max(1, Math.round(d / step));
    for (let k = 1; k <= n; k++) {
      pts.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]);
    }
  }
  return pts;
}

function pathKm(pts) {
  const cosLat = Math.cos(pts[0][0] * Math.PI / 180);
  let m = 0;
  for (let i = 1; i < pts.length; i++) m += dist(pts[i - 1], pts[i], cosLat);
  return m / 1000;
}

// вырезает тупики: места, где путь доходит до конца и возвращается по тем же точкам
// (a -> b -> тупик -> b -> a превращается в a). Возвращает число вырезанных тупиков.
function removeSpurs(pts, tol = 4) {
  const cosLat = Math.cos(pts[0][0] * Math.PI / 180);
  let removed = 0, changed = true;
  while (changed) {
    changed = false;
    for (let m = 1; m < pts.length - 1; m++) {
      // m - точка разворота: соседи слева и справа лежат в одном и том же месте
      if (dist(pts[m - 1], pts[m + 1], cosLat) > tol) continue;
      let k = 1;
      while (m - k - 1 >= 0 && m + k + 1 < pts.length &&
             dist(pts[m - k - 1], pts[m + k + 1], cosLat) <= tol) k++;
      pts.splice(m - k + 1, 2 * k); // pts[m-k] ≈ pts[m+k]: оставляем один из двойников
      removed++;
      changed = true;
      break;
    }
  }
  return removed;
}

// доля пути, который проходится повторно (0..1): точка близка к другой точке,
// пройденной больше 200 м пути назад. Начало и конец круга не считаем.
function overlapRatio(pts) {
  const cell = 15, near = 12, gap = 20, edge = 20;
  const cosLat = Math.cos(pts[0][0] * Math.PI / 180);
  const grid = new Map();
  let rep = 0, cnt = 0;
  pts.forEach((p, i) => {
    const cx = Math.floor(p[0] * M_LAT / cell), cy = Math.floor(p[1] * M_LON * cosLat / cell);
    if (i >= edge && i < pts.length - edge) {
      cnt++;
      let hit = false;
      for (let dx = -1; dx <= 1 && !hit; dx++) {
        for (let dy = -1; dy <= 1 && !hit; dy++) {
          const arr = grid.get((cx + dx) + ':' + (cy + dy));
          if (!arr) continue;
          for (const j of arr) {
            if (i - j > gap && dist(p, pts[j], cosLat) < near) { hit = true; break; }
          }
        }
      }
      if (hit) rep++;
    }
    const key = cx + ':' + cy;
    if (!grid.has(key)) grid.set(key, []);
    grid.get(key).push(i);
  });
  return cnt ? rep / cnt : 0;
}

// очистка маршрута круга: тупики долой, длина и повторы считаются заново
function processLoop(raw) {
  const pts = resample(raw.line);
  if (pts.length < 10) return null;
  const spurs = removeSpurs(pts);
  if (pts.length < 10) return null;
  const km = pathKm(pts);
  return { line: pts, km, min: km * 12, spurs, overlap: overlapRatio(pts) }; // 5 км/ч
}

// n точек на окружности, проходящей через текущее положение
function loopPoints(angle, r, dir, n) {
  const kLat = 111.32, kLon = 111.32 * Math.cos(me[0] * Math.PI / 180);
  const center = [me[0] + (r / kLat) * Math.sin(angle), me[1] + (r / kLon) * Math.cos(angle)];
  const pts = [me];
  for (let i = 1; i < n; i++) {
    const a = angle + Math.PI + dir * (2 * Math.PI * i) / n;
    pts.push([center[0] + (r / kLat) * Math.sin(a), center[1] + (r / kLon) * Math.cos(a)]);
  }
  pts.push(me);
  return pts;
}

// ---------- круговой маршрут ----------

async function buildLoop() {
  if (!me) { status('Сначала определи своё положение.'); return; }
  const km = parseFloat($('km').value) || 3;
  const btn = $('build');
  btn.disabled = true;

  const MAX_TRIES = 12, MAX_FAILS = 3;
  const OVERLAP_OK = 0.03, LEN_OK = 0.15;
  let scale = 0.75;            // радиус круга относительно "идеального"; подстраивается сам
  let best = null, tried = 0, fails = 0, lastErr = '';
  const base = Math.random() * 2 * Math.PI;

  try {
    for (let i = 0; i < MAX_TRIES; i++) {
      status(`Ищу круг без повторов: вариант ${i + 1} из ${MAX_TRIES}...`);
      const angle = base + i * 2.4;                 // направления не повторяются
      const r = (km / (2 * Math.PI)) * scale;

      let c = null;
      try {
        const raw = await fetchRoute(loopPoints(angle, r, i % 2 ? 1 : -1, 4 + (i % 3)));
        c = processLoop(raw);
        fails = 0;
      } catch (e) {
        lastErr = e.message;
        if (++fails >= MAX_FAILS) break;            // роутер недоступен - не мучаем
        continue;
      }
      if (!c) continue;

      tried++;
      c.lenErr = Math.abs(c.km - km) / km;
      c.score = c.lenErr + 3 * c.overlap;           // повторы штрафуются сильнее длины
      if (!best || c.score < best.score) {
        best = c;
        drawRoute(best);                            // сразу показываем лучший на данный момент
      }

      if (best.overlap <= OVERLAP_OK && best.lenErr <= LEN_OK) break; // хороший найден

      // подгоняем радиус под нужную длину
      scale *= Math.pow(Math.min(2, Math.max(0.5, km / c.km)), 0.7);
      scale = Math.min(1.5, Math.max(0.3, scale));
      await new Promise(res => setTimeout(res, 200)); // не долбим публичный сервер
    }

    if (!best) throw new Error(lastErr || 'ни один вариант не построился');
    const head = `Длина: ${best.km.toFixed(1)} км (цель ${km}), ~${Math.round(best.min)} мин`;
    status(best.overlap <= OVERLAP_OK
      ? head + ', без повторов'
      : head + `, повторов ${Math.round(best.overlap * 100)}% (без повторов не нашлось, взял лучший из ${tried})`);
    console.log('loop: вариантов', tried, 'тупиков вырезано', best.spurs, 'повторы', best.overlap);
  } catch (err) {
    status('Не удалось построить круг: ' + err.message);
    console.log('loop error:', err);
  } finally {
    btn.disabled = false;
  }
}

function setMode(m) {
  mode = m;
  $('modePoint').classList.toggle('active', m === 'point');
  $('modeLoop').classList.toggle('active', m === 'loop');
  $('loopRow').style.display = m === 'loop' ? 'flex' : 'none';
  status(m === 'point' ? 'Тапни по карте, куда идти.' : 'Задай длину и нажми «Построить».');
}

$('locate').onclick = locate;
$('modePoint').onclick = () => setMode('point');
$('modeLoop').onclick = () => setMode('loop');
$('build').onclick = buildLoop;
</script>
</body>
</html>
